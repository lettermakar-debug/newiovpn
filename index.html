<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Newio VPN</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0d0e12;
      --card-bg: #16181f;
      --accent: #6c5ce7;
      --accent-hover: #5a4bcf;
      --text: #ffffff;
      --text-muted: #8e8ea0;
      --border: #232631;
      --success: #00b894;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #a8c0ff, #3f2b96);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .step-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Тарифы */
    .plans {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .plan-item {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .plan-item.selected {
      border-color: var(--accent);
      background: rgba(108, 92, 231, 0.1);
    }

    .plan-name {
      font-weight: 600;
      font-size: 15px;
    }

    .plan-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
    }

    /* Кнопки */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:active {
      background: var(--accent-hover);
    }

    .btn-success {
      background: var(--success);
    }

    /* Блок с ключом (скрыт до оплаты) */
    #keySection {
      display: none;
    }

    .key-box {
      background: #090a0d;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      color: #a8c0ff;
      margin-bottom: 12px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">NEWIO VPN</div>
    <div class="subtitle">Быстрый и защищенный доступ в интернет</div>
  </div>

  <!-- ШАГ 1: Выбор и Оплата -->
  <div class="step-card" id="paymentSection">
    <div class="step-title">1. Выберите подписку</div>
    <div class="plans">
      <div class="plan-item selected" onclick="selectPlan(this, '100 ₽')">
        <div class="plan-name">1 Месяц</div>
        <div class="plan-price">100 ₽</div>
      </div>
      <div class="plan-item" onclick="selectPlan(this, '270 ₽')">
        <div class="plan-name">3 Месяца <small style="color:var(--success)">-10%</small></div>
        <div class="plan-price">270 ₽</div>
      </div>
      <div class="plan-item" onclick="selectPlan(this, '500 ₽')">
        <div class="plan-name">6 Месяцев <small style="color:var(--success)">-15%</small></div>
        <div class="plan-price">500 ₽</div>
      </div>
    </div>
    <button class="btn" id="payBtn" onclick="processPayment()">Оплатить 100 ₽</button>
  </div>

  <!-- ШАГ 2: Ключ (появляется только после оплаты) -->
  <div class="step-card" id="keySection">
    <div class="step-title">2. Ваш VPN-ключ готов ✅</div>
    <div class="key-box" id="vlessKey">vless://newiovpn-access-key-example-123456789@node1.newio.net:443?type=tcp#NewioVPN</div>
    <button class="btn btn-success" onclick="copyKey()">Скопировать ключ</button>
  </div>

  <div class="toast" id="toast">Ключ скопирован!</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentPrice = '100 ₽';

    function selectPlan(element, price) {
      document.querySelectorAll('.plan-item').forEach(item => item.classList.remove('selected'));
      element.classList.add('selected');
      currentPrice = price;
      document.getElementById('payBtn').innerText = 'Оплатить ' + price;
    }

    function processPayment() {
      // Имитация оплаты (в реальном боте здесь вызывается tg.openInvoice или перевод на платежку)
      tg.sendData(JSON.stringify({ action: "payment", amount: currentPrice }));
      
      // Показываем блок с ключом после нажатия оплаты
      document.getElementById('paymentSection').style.display = 'none';
      document.getElementById('keySection').style.display = 'block';
    }

    function copyKey() {
      const keyText = document.getElementById('vlessKey').innerText;
      navigator.clipboard.writeText(keyText).then(() => {
        showToast();
      }).catch(() => {
        // Запасной вариант копирования
        const area = document.createElement('textarea');
        area.value = keyText;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        showToast();
      });
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
